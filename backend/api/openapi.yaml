openapi: 3.0.3
info:
  title: Renovation Budget API
  version: 1.0.0
  description: 装修预算与支出管理 API 服务
servers:
  - url: http://localhost:19306/api/v1
paths:
  /healthz:
    get:
      summary: 健康检查
      responses:
        "200":
          description: ok
  /auth/login:
    post:
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: ok
  /budgets:
    get:
      summary: 查询预算表列表
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: ok }
    post:
      summary: 创建预算表
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: ok }
  /expenses:
    get:
      summary: 查询支出记录列表
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: ok }
    post:
      summary: 创建支出记录
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: ok }
  /expenses/{id}/refunds:
    get:
      summary: 查询支出的退款记录
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: ok }
        "404": { description: 支出不存在 }
    post:
      summary: 登记退款（财务）
      description: >
        针对已付款支出分次登记退款金额、到账日期、原因与退款凭据号。
        累计退款超过本笔实付金额时返回 409 且全部余额保持不变；
        退款凭据号重复时只有第一次入账；成功后回冲预算分项与预算表已用金额。
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, received_date, voucher_no]
              properties:
                amount: { type: number, format: double, minimum: 0, exclusiveMinimum: true }
                received_date: { type: string, format: date, example: "2026-08-15" }
                reason: { type: string, maxLength: 512 }
                voucher_no: { type: string, maxLength: 128, description: 退款凭据号，全局唯一 }
      responses:
        "200": { description: ok }
        "400": { description: 参数错误 }
        "403": { description: 无退款登记权限 }
        "404": { description: 支出不存在 }
        "409": { description: 支出未付款 / 累计退款超额 / 凭据号重复 }
  /suppliers:
    get:
      summary: 查询供应商列表
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: ok }
    post:
      summary: 创建供应商
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: ok }
  /reconciliations:
    get:
      summary: 查询对账单列表
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: ok }
    post:
      summary: 创建对账单
      security: [{ BearerAuth: [] }]
      responses:
        "200": { description: ok }
components:
  securitySchemes:
    BearerAuth:
      type: apiKey
      in: header
      name: Authorization
